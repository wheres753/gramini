# ---------------------------------------------------------------------------
# Running this yourself?
#   1. Change `bundleIdPrefix` below (and PRODUCT_BUNDLE_IDENTIFIER to match)
#      to a reverse-DNS prefix you own.
#   2. Export your Apple Developer Team ID, then generate:
#        GRAMINI_TEAM_ID=YOURTEAMID xcodegen generate
#      (developer.apple.com -> Membership). It is read from the environment so
#      it stays out of the repo; if it is unset the signing settings come out
#      as the literal "${GRAMINI_TEAM_ID}" and Xcode will fail to sign.
# ---------------------------------------------------------------------------
name: Gramini
options:
  bundleIdPrefix: com.wheres753             # <- a reverse-DNS prefix you own
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.5"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: ${GRAMINI_TEAM_ID}    # <- from the environment, see header
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    # Local builds are build 1; ci_scripts/ci_post_clone.sh rewrites this line
    # with CI_BUILD_NUMBER on Xcode Cloud.
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  Gramini:
    type: application
    platform: iOS
    sources:
      - path: ios/Sources
      - path: shared
        buildPhase: resources
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: Gramini
        CFBundleName: Gramini
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Gramini needs photo library access so you can choose photos and videos to post on Instagram.
        NSCameraUsageDescription: Gramini needs camera access so you can take a photo or video to post on Instagram.
        NSMicrophoneUsageDescription: Gramini needs microphone access when recording a video to post on Instagram.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wheres753.gramini   # <- prefix above + .gramini
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
schemes:
  Gramini:
    build:
      targets:
        Gramini: all
    run:
      config: Debug
    archive:
      config: Release
