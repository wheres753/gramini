# Fallback for Xcode Cloud (spec §7.2). Not scheduled by default: enable the
# cron below once the secrets exist, otherwise every run would fail.
#
# Required repository secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY   App Store Connect API key (.p8 contents)
#   DIST_CERT_P12_BASE64, DIST_CERT_PASSWORD     Apple Distribution certificate
#   DEVELOPMENT_TEAM                             Apple Developer Team ID
#                                                (developer.apple.com -> Membership)
name: TestFlight (fallback)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 14 1 * *"   # 1st of every month, 14:00 UTC

jobs:
  archive-and-upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || ls /Applications | grep Xcode

      - name: Install XcodeGen and generate project
        env:
          # project.yml reads DEVELOPMENT_TEAM from the environment, so the Team
          # ID lives in repository secrets rather than in the repo.
          GRAMINI_TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          if [ -z "$GRAMINI_TEAM_ID" ]; then
            echo "error: the DEVELOPMENT_TEAM repository secret is not set." >&2
            exit 1
          fi
          brew install xcodegen
          sed -i '' "s/^\( *CURRENT_PROJECT_VERSION: \)\"[0-9]*\"/\1\"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate

      - name: Import distribution certificate
        env:
          P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > dist.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive
        run: |
          xcodebuild -project Gramini.xcodeproj -scheme Gramini -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Gramini.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            archive

      - name: Export and upload
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.DEVELOPMENT_TEAM }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Gramini.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
